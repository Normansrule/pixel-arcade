<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>README hero</title>
<!-- The README header: the arcade cabinets and the PIXEL ARCADE title.
     tools/readme_intro.js renders it twice: a still (docs/screenshot.png) and a looping animated header
     (docs/readme/hero.webp) where the camera drifts through the room, the neon hums and the middle cabinet
     flips between real games in attract mode.
     To tweak it by eye: python3 -m http.server 8765  then  http://127.0.0.1:8765/tools/readme_hero.html?games=521&worlds=55&cabs=466
     ?anim=1 waits for window.frame(i, n) calls instead of drawing once; ?bare=1 renders the room alone (docs/intro.jpg). -->
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
 html,body{margin:0;width:1280px;height:800px;overflow:hidden;background:#0c0f17}
 #v{position:absolute;inset:0}
 .ov{position:absolute;inset:0;pointer-events:none;color:#eceae3}
 /* screen-wide finish: a soft vignette, a warm floor glow and faint scanlines, like looking at the room through a monitor */
 .ov::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,10,16,.82) 0,rgba(8,10,16,.45) 34%,transparent 58%),linear-gradient(0deg,rgba(8,10,16,.7) 0,transparent 30%)}
 .ov::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 62% 45%,transparent 55%,rgba(5,7,12,.7) 100%),repeating-linear-gradient(rgba(0,0,0,0) 0 3px,rgba(0,0,0,.07) 3px 4px)}
 .tag{position:absolute;top:34px;margin:0;font:15px/1 'PA Pixel';letter-spacing:.14em;color:#959aa8;z-index:1}
 .tag.l{left:44px}.tag.r{right:44px}
 .tag b{color:#ff4d00;font-weight:400;text-shadow:0 0 12px rgba(255,77,0,.9)}
 .off .tag b{opacity:.15;text-shadow:none}
 .kick{position:absolute;left:46px;top:212px;margin:0;font:16px/1 'PA Pixel';letter-spacing:.16em;color:#ff4d00;z-index:1}
 .kick i{display:inline-block;width:38px;height:2px;margin:0 14px 4px 0;background:#ff4d00;vertical-align:middle;box-shadow:0 0 10px rgba(255,77,0,.8)}
 h1{position:absolute;left:36px;top:246px;margin:0;font:400 214px/.8 Anton,Impact,sans-serif;letter-spacing:-.005em;text-transform:uppercase;z-index:1;
  background:linear-gradient(180deg,#ffffff 0%,#eceae3 52%,#b9b5ab 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
 h1 span{display:block}
 h1 span+span{margin-top:6px}
 /* the full stop is a lit orange pixel, the arcade's signal colour */
 .dot{position:absolute;left:var(--dx,700px);top:var(--dy,600px);width:30px;height:30px;background:#ff4d00;box-shadow:0 0 34px rgba(255,77,0,.75),0 0 90px rgba(255,77,0,.35);z-index:1}
 .sub{position:absolute;left:46px;bottom:64px;margin:0;font:18px/1.6 'PA Pixel';letter-spacing:.08em;color:#eceae3;z-index:1}
 .sub em{font-style:normal;color:#8f9fff}
 .stats{position:absolute;right:44px;bottom:50px;display:flex;z-index:1}
 .stats div{width:128px;padding:16px 16px 14px;border:1px solid rgba(236,234,227,.18);margin-left:-1px;background:rgba(12,15,23,.62);backdrop-filter:blur(8px)}
 .stats b{display:block;font:400 46px/1 Anton,sans-serif;color:#eceae3}
 .stats small{display:block;margin-top:10px;font:12px/1 'PA Pixel';letter-spacing:.1em;color:#959aa8}
 .stats div:first-child b{color:#ff4d00;text-shadow:0 0 22px rgba(255,77,0,.45)}
 .now{position:absolute;right:44px;top:70px;margin:0;font:13px/1 'PA Pixel';letter-spacing:.14em;color:#959aa8;z-index:1}
 .now b{font-weight:400;color:#eceae3}
</style>
</head>
<body>
<canvas id="v" width="1280" height="800"></canvas>
<div class="ov">
  <p class="tag l">[ <b>●</b> INSERT COIN ]</p>
  <p class="tag r">BROWSER · FREE · OFFLINE · OPEN SOURCE</p>
  <p class="now">NOW PLAYING · <b id="np">HOOPS 1 ON 1</b></p>
  <p class="kick"><i></i>THE DIGITAL ARCADE</p>
  <h1><span>Pixel</span><span id="t2">Arcade</span></h1><div class="dot"></div>
  <p class="sub">→ <em>PICK A CABINET.</em> NO INSTALLS, NO ACCOUNT, NO WAITING.<br>&nbsp;&nbsp;EVERY ROUND ENDS ON THE CLOCK.</p>
  <div class="stats"><div><b id="sg">521</b><small>GAMES</small></div><div><b id="sc">466</b><small>CABINETS</small></div><div><b id="sw">55</b><small>3D WORLDS</small></div></div>
</div>
<script type="module">
import * as THREE from '../vendor/three.module.min.js';
import {EffectComposer} from '../vendor/jsm/postprocessing/EffectComposer.js';
import {RenderPass} from '../vendor/jsm/postprocessing/RenderPass.js';
import {UnrealBloomPass} from '../vendor/jsm/postprocessing/UnrealBloomPass.js';
import {OutputPass} from '../vendor/jsm/postprocessing/OutputPass.js';
import {arcadeScene, NAMES} from '../js/arcade-scene.js';

await document.fonts.load('64px "PA Pixel"');await document.fonts.load('200px Anton');
const q=new URLSearchParams(location.search),anim=!!q.get('anim'),bare=!!q.get('bare');
for(const [k,id] of [['games','sg'],['cabs','sc'],['worlds','sw']])if(q.get(k))document.getElementById(id).textContent=q.get(k);
// sit the orange pixel on the baseline just after ARCADE
const t2=document.getElementById('t2').getBoundingClientRect();
document.querySelector('.dot').style.cssText=`--dx:${t2.left+document.getElementById('t2').scrollWidth+14}px;--dy:${t2.bottom-44}px`;
if(bare)document.querySelector('.ov').style.display='none';
let loaded=false;THREE.DefaultLoadingManager.onLoad=()=>{loaded=true;};
const cv=document.getElementById('v'),W=1280,H=800;
const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});
r.setPixelRatio(+(q.get('dpr')||1));r.setSize(W,H,false);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.12;r.outputColorSpace=THREE.SRGBColorSpace;

// attract mode on the middle cabinet: real game screenshots, switched with a burst of CRT static
const PLAYLIST=['starrun','hoops','artillery','boxing','spellcaster','bowling'];
const live=document.createElement('canvas');live.width=320;live.height=240;const lx=live.getContext('2d');lx.imageSmoothingEnabled=false;
const shots=await Promise.all(PLAYLIST.map(id=>new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src='../docs/thumbs/'+id+'.jpg';})));
const np=document.getElementById('np');
const screen=u=>{ // u: 0..1 through the loop
  const k=u*PLAYLIST.length+.5,i=Math.floor(k)%PLAYLIST.length,f=k-Math.floor(k),im=shots[i];
  if(im)lx.drawImage(im,0,0,320,240);else{lx.fillStyle='#111';lx.fillRect(0,0,320,240);}
  np.textContent=NAMES[PLAYLIST[i]]||PLAYLIST[i].toUpperCase();
  // the first and last few percent of each game is static, so the cut reads as a channel change
  const s=f<.06?1-f/.06:f>.96?(f-.96)/.04:0;
  if(s>0){const d=lx.getImageData(0,0,320,240),p=d.data;for(let j=0;j<p.length;j+=4){const n=Math.random()*255;p[j]=p[j]*(1-s)+n*s;p[j+1]=p[j+1]*(1-s)+n*s;p[j+2]=p[j+2]*(1-s)+n*s;}lx.putImageData(d,0,0);}
  // a rolling bright band, like an old tube
  const y=f*280-20;lx.fillStyle='rgba(255,255,255,.07)';lx.fillRect(0,y,320,14);};
screen(0);

// the games on the other screens; any canvas game with a thumbnail in docs/thumbs works (?ids=a,b,c to change them)
const room=arcadeScene(THREE,{base:'../',ids:q.get('ids')?q.get('ids').split(','):undefined,aspect:W/H,cones:true,live:bare?null:live}),{scene,cam,start}=room;room.useRenderer(r);
// frame the ring a touch higher and closer than the front-page intro, so the cabinets fill the right-hand side
const P0=bare?start.pos.clone():start.pos.clone().add(new THREE.Vector3(-1.1,.15,-1.2)),L0=bare?start.look.clone():start.look.clone().add(new THREE.Vector3(.9,.35,0));
cam.position.copy(P0);cam.lookAt(L0);

const comp=new EffectComposer(r);comp.addPass(new RenderPass(scene,cam));
comp.addPass(new UnrealBloomPass(new THREE.Vector2(W,H),.55,.55,.82));comp.addPass(new OutputPass());
const ov=document.querySelector('.ov');
// one frame of a seamless loop: the camera drifts on a small ellipse and sways its aim, so the last frame meets the first
window.frame=(i,n)=>{const u=i/n,a=bare?0:u*Math.PI*2;
  cam.position.set(P0.x+Math.sin(a)*.9,P0.y+Math.sin(a*2)*.07,P0.z+(Math.cos(a)-1)*.35);
  cam.lookAt(L0.x+Math.sin(a)*.35,L0.y,L0.z);
  screen(u);room.tick(u*12000);ov.classList.toggle('off',Math.floor(u*8)%2===1);comp.render();};
// wait for every screenshot texture, then draw a few frames so bloom settles
const wait=()=>loaded?(window.frame(0,1),window.frame(0,1),window.HERO_READY=true):setTimeout(wait,50);wait();
</script>
</body>
</html>
