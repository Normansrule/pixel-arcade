<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Critter Kart · Pixel Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--pixel:'Press Start 2P','Courier New',monospace;--body:'Rubik',system-ui,sans-serif;--y:#ffcf3f;--p:#ff3f8e;--t:#2fe8d0;--ink:#07030f}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#07030f;color:#fff3d6;font-family:var(--body);overflow:hidden}
#c{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none}
.hud{position:absolute;font-family:var(--pixel);font-size:.7rem;text-shadow:2px 2px 0 #000}
.hud.big{font-size:1.6rem}
.item{position:absolute;width:56px;height:56px;border:3px solid #fff;background:rgba(7,3,15,.6);display:flex;align-items:center;justify-content:center;font-family:var(--pixel);font-size:.55rem;text-align:center;line-height:1.3}
.msg{position:absolute;left:0;right:0;text-align:center;font-family:var(--pixel);font-size:2rem;color:var(--y);text-shadow:4px 4px 0 var(--p);}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#3a1a6a,#07030f 70%);pointer-events:auto}
h1{font-family:var(--pixel);color:var(--y);text-shadow:4px 4px 0 var(--p),8px 8px 0 #3a2a78;font-size:clamp(1.4rem,5vw,3rem);margin:0 0 6px}
.sub{font-size:1rem;color:#b9b0e6;margin-bottom:26px}
.row{display:flex;gap:14px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.opt{font:.65rem var(--pixel);padding:14px 18px 12px;background:#3a2a78;color:#fff3d6;border:0;cursor:pointer;box-shadow:0 4px 0 #1a1140}
.opt.on{background:var(--p);box-shadow:0 4px 0 #8e1b52}
.opt.go{background:var(--t);color:var(--ink);box-shadow:0 4px 0 #178a7d;font-size:.85rem;padding:18px 34px 16px;margin-top:18px}
.chars{display:grid;grid-template-columns:repeat(4,110px);gap:10px;margin:8px 0 4px}
.ch{background:#1a1140;border:3px solid #3a2a78;padding:8px;text-align:center;cursor:pointer}
.ch.p1{border-color:var(--t)}.ch.p2{border-color:var(--p)}
.ch canvas{width:90px;height:70px;display:block;margin:0 auto}
.ch b{font:.5rem var(--pixel);color:var(--y);display:block;margin-top:6px}
.ch i{font-size:.72rem;color:#b9b0e6}
.lbl{font:.55rem var(--pixel);color:#b9b0e6;margin:12px 0 4px}
.help{font-size:.85rem;color:#b9b0e6;margin-top:14px;text-align:center;max-width:60ch}
.help kbd{font:.5rem var(--pixel);background:var(--ink);border:1px solid #7f74b8;padding:2px 5px;color:var(--y)}
a.back{position:fixed;bottom:10px;left:10px;font:.55rem var(--pixel);color:#fff3d6;background:#3a2a78;padding:10px 12px 8px;text-decoration:none;z-index:5}
#results{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(7,3,15,.82);pointer-events:auto}
#results ol{font:.75rem var(--pixel);line-height:2.4;padding:0 0 0 1.5em;margin:0}
</style>
</head>
<body>
<a class="back" href="../">◀ Arcade</a>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="menu">
  <h1>Critter Kart</h1>
  <div class="sub">8 racers · 3 laps · items · split-screen for 2</div>
  <div class="lbl">HUMAN PLAYERS</div>
  <div class="row" id="players"><button class="opt on" data-n="1">1 PLAYER + 7 CPU</button><button class="opt" data-n="2">2 PLAYERS + 6 CPU</button></div>
  <div class="lbl">CPU SKILL</div>
  <div class="row" id="skill"><button class="opt" data-s="0">EASY</button><button class="opt on" data-s="1">NORMAL</button><button class="opt" data-s="2">HARD</button></div>
  <div class="lbl">PICK YOUR CRITTER (CLICK: P1 · SHIFT+CLICK: P2)</div>
  <div class="chars" id="chars"></div>
  <button class="opt go" id="go">START RACE</button>
  <div class="help">P1: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> drive, <kbd>F</kbd> item, <kbd>Shift</kbd> drift. &nbsp; P2: <kbd>Arrows</kbd> drive, <kbd>Enter</kbd> item, <kbd>/</kbd> drift. &nbsp; <kbd>Esc</kbd> menu. Gamepads work too: stick, A = gas, X = item.</div>
</div>
<div id="results"><h1>Results</h1><ol id="rlist"></ol><button class="opt go" id="again">RACE AGAIN</button></div>
<script type="module" src="game.js"></script>
</body>
</html>
